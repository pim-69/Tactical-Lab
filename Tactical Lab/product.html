<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Product</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; }
    .main-content {
      width: 100%;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      box-sizing: border-box;
    }
    .product-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      width: 100%;
      margin-top: 60px;
      flex-wrap: wrap;
    }
    .main-image {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
    }
    .main-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      background: rgba(0,0,0,0.2);
      transition: 0.2s;
    }
    .thumb:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .product-description {
      width: 80%;
      max-width: 900px;
      margin-top: 40px;
    }
    .product-description textarea {
      width: 100%;
      height: 150px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      color: white;
      padding: 15px;
      font-size: 16px;
      resize: none;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
    }
    @media (max-width: 768px) {
      .product-top { flex-direction: column; gap: 20px; margin-top: 20px; }
      .thumbs { flex-direction: row; justify-content: center; }
      .thumb { width: 70px; height: 70px; }
      .product-description { width: 95%; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">TACTICAL LAB</div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="product-top">
      <div class="main-image">
        <img id="mainImg" src="images/product1.png">
      </div>

      <div class="thumbs">
        <div class="thumb"><img src="images/product1.png" onclick="changeImg(this)"></div>
        <div class="thumb"><img src="images/product2.png" onclick="changeImg(this)"></div>
        <div class="thumb"><img src="images/product3.png" onclick="changeImg(this)"></div>
      </div>
    </div>

    <div class="product-description">
      <textarea placeholder="Описание товара...">АРМЕЙСКИЙ БРОНЕЖИЛЕТ MODEL: ARTX-07. Обеспечивает защиту класса 7.62. Создан для экстремальных боевых условий.</textarea>
    </div>

    <div class="product-controls">
    </div>
  </div>

  <div class="scanlines"></div>

  <script>
    function changeImg(el) {
      document.getElementById("mainImg").src = el.src;
    }
  </script>
</body>
</html>
