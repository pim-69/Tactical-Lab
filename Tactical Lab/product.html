<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Product Specifications</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; }
    .main-content {
      width: 100%;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      box-sizing: border-box;
    }
    .product-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      width: 100%;
      margin-top: 60px;
      flex-wrap: wrap;
    }
    .main-image {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
    }
    .main-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .thumb {
      width: 100px;
      height: 100px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      background: rgba(0,0,0,0.2);
      transition: 0.2s;
    }
    .thumb:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .product-info-panel {
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .product-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.3rem;
      color: #fff;
      margin: 0;
      text-transform: uppercase;
    }
    .product-price {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2rem;
      color: var(--accent);
      font-weight: 700;
    }
    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      margin-top: 15px;
      display: inline-block;
    }
    .back-link:hover { color: var(--accent); }

    .product-description {
      width: 80%;
      max-width: 900px;
      margin-top: 40px;
    }
    .product-description textarea {
      width: 100%;
      height: 150px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      color: white;
      padding: 15px;
      font-size: 16px;
      resize: none;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
    }
    @media (max-width: 768px) {
      .product-top { flex-direction: column; gap: 20px; margin-top: 20px; }
      .thumbs { flex-direction: row; justify-content: center; }
      .thumb { width: 70px; height: 70px; }
      .product-description { width: 95%; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo" style="cursor:pointer;" onclick="window.location.href='index.html'">TACTICAL LAB</div>
  </div>

  <div class="main-content">
    <div class="product-top">
      <div class="main-image">
        <img id="mainImg" src="">
      </div>

      <div class="thumbs">
        <div class="thumb"><img id="t1" src="" onclick="changeImg(this)"></div>
        <div class="thumb"><img id="t2" src="images/product2.png" onclick="changeImg(this)"></div>
        <div class="thumb"><img id="t3" src="images/product3.png" onclick="changeImg(this)"></div>
      </div>

      <div class="product-info-panel">
        <h1 id="productName" class="product-title">TACTICAL GEAR</h1>
        <div id="productPrice" class="product-price">$0</div>
        <button class="btn" onclick="addToCartProduct()">ADD TO INVENTORY</button>
        <div>
          <a href="index.html" class="back-link"><< RETURN TO ARMORY</a>
        </div>
      </div>
    </div>

    <div class="product-description">
      <textarea placeholder="Описание товара...">АРМЕЙСКИЙ КОМПЛЕКТ MODEL: ARTX-07. Создан для экстремальных боевых условий. Проверен в полевых операциях.</textarea>
    </div>
  </div>

  <div class="scanlines"></div>

  <script>
    const price = localStorage.getItem("productPrice") || "100";
    const name = localStorage.getItem("productName") || "Tactical Gear";
    const img = localStorage.getItem("productImg") || "images/armor.png";

    document.getElementById("productPrice").innerText = "$" + price;
    document.getElementById("productName").innerText = name;
    document.getElementById("mainImg").src = img;
    document.getElementById("t1").src = img;

    function changeImg(el) {
      document.getElementById("mainImg").src = el.src;
    }

    function addToCartProduct() {
      let cart = JSON.parse(localStorage.getItem('tacticalCart')) || [];
      cart.push({ name: name, price: price, img: img });
      localStorage.setItem('tacticalCart', JSON.stringify(cart));
      alert("// LOADOUT UPDATED: CONFIGURATION COMPLETED");
    }
  </script>
</body>
</html>
